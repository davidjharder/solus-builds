# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : audacity
version    : 4.0.2
release    : 54
source     :
    - https://github.com/audacity/audacity/releases/download/Audacity-4.0.2/audacity-sources-4.0.2.tar.xz : 4799c2ce2deabacf2be8d6d6b3c5a5621bcd3aacf7c1c38bd0a3f2598f1034c0
homepage   : https://www.audacityteam.org/
license    :
    - CC-BY-SA-3.0
    - GPL-2.0-or-later
component  : multimedia.audio
summary    : A Free, Cross-Platform Digital Audio Editor
description: |
    Audacity is free, open source, cross-platform audio software for multi-track recording and editing.
extract: false
builddeps  :
    - qt6-base-private-devel
    - pkgconfig(Qt6Qml)
    - pkgconfig(sndfile)
    - pkgconfig(libpng)
    - pkgconfig(Qt6Svg)
    - pkgconfig(lilv-0)
    - pkgconfig(suil-0)
    - pkgconfig(wavpack)
    - wxwidgets-devel
    - pkgconfig(portaudio-2.0)
    -  pkgconfig(id3tag)
    - pkgconfig(Qt6ShaderTools)
    - pkgconfig(id3tag)
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(Qt6NetworkAuth)
    - pkgconfig(Qt6Linguist)
    - pkgconfig(ogg)
    - pkgconfig(vorbis)
    - pkgconfig(flac)
    - pkgconfig(opusfile)
    - lame-devel
    - pkgconfig(libmpg123)
rundeps    :
    - alsa-plugins
setup      : |
   # manually extract to work around https://github.com/getsolus/solbuild/issues/126
    tar --strip-components=1 -xf $sources/audacity-sources-%version%.tar.xz
   
    # Fix soname for libid3tag
    %patch -p1 -i ${pkgfiles}/muse_deps-PR-56.patch
    
   %cmake_ninja \
        -DEXTDEPS_OVERRIDE_ALL=SYSTEM
uild      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE.txt
